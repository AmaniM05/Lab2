<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SEG3502 Lab 2 - Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div>
    <h1>Calculator</h1>

    <p th:if="${error != null}" th:text="${error}"></p>

    <form th:action="@{/calculate}" method="post">
        <table>
            <tr>
                <td><label for="first">First number:</label></td>
                <td><input id="first" name="first" th:value="${first}"></td>
            </tr>
            <tr>
                <td><label for="second">Second number:</label></td>
                <td><input id="second" name="second" th:value="${second}"></td>
            </tr>
            <tr>
                <td><button type="submit" name="operation" value="add">+</button></td>
                <td><button type="submit" name="operation" value="subtract">-</button></td>
            </tr>
            <tr>
                <td><button type="submit" name="operation" value="multiply">x</button></td>
                <td><button type="submit" name="operation" value="divide">/</button></td>
            </tr>
        </table>
    </form>

    <p class="result" th:if="${result != null}" th:text="${'Result: ' + result}"></p>
</div>
</body>
</html>
